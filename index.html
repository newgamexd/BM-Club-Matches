<div id="club-widget">
  <div class="header">📅 Sự Kiện Sắp Tới</div>
  <div id="matches">Loading...</div>
</div>

<style>
#club-widget{
  max-width:520px;
  margin:auto;
  padding:15px;
  background:#120000;
  border:2px solid #ff3333;
  border-radius:15px;
  box-shadow:0 0 18px rgba(255,0,0,.5);
  font-family:Arial;
  color:#fff;
}

.header{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#ff4d4d;
  margin-bottom:15px;
  text-shadow:0 0 10px red;
}

.match{
  background:rgba(255,0,0,.08);
  border:1px solid rgba(255,80,80,.4);
  border-radius:12px;
  padding:12px;
  margin:10px 0;
  transition:.2s;
}

.match:hover{
  transform:scale(1.02);
  box-shadow:0 0 12px rgba(255,0,0,.4);
}

.text{
  font-size:15px;
  color:#ffd6d6;
}

.btn{
  display:inline-block;
  margin-top:8px;
  padding:6px 12px;
  background:#ff3333;
  color:#fff;
  border-radius:8px;
  text-decoration:none;
  font-size:13px;
  transition:.2s;
}

.btn:hover{
  background:#ff5555;
}
</style>

<script>
fetch("https://api.chess.com/pub/club/blunder-master-vn/matches")
.then(r => r.json())
.then(data => {

  const upcoming = data.registered || [];

  upcoming.sort((a,b) => a.start_time - b.start_time);

  const latest = upcoming.slice(0,3);

  document.getElementById("matches").innerHTML = latest.map(m => {

    const matchName = m.name || "Club Match";

    const date = m.start_time
      ? new Date(m.start_time * 1000).toLocaleString("vi-VN")
      : "Unknown time";

    return `
      <div class="match">
        <div class="text">⚔️ ${matchName}, "${date}"</div>
        <a class="btn" href="${m.url}" target="_blank">
          🚀 Tham gia match
        </a>
      </div>
    `;
  }).join("");

})
.catch(()=>{
  document.getElementById("matches").innerHTML =
    "<div class='match'>Không tải được dữ liệu</div>";
});
</script>
