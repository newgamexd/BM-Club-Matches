<div id="club-widget">
  <div class="header">📅 Sự Kiện Sắp Tới</div>
  <div id="matches">Loading...</div>
</div>

<style>
#club-widget{
  max-width:520px;
  margin:auto;
  padding:15px;
  background:#120000;
  border:2px solid #ff3333;
  border-radius:15px;
  box-shadow:0 0 18px rgba(255,0,0,.5);
  font-family:Arial;
  color:#fff;
}

.header{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#ff4d4d;
  margin-bottom:15px;
  text-shadow:0 0 10px red;
}

.match{
  background:rgba(255,0,0,.08);
  border:1px solid rgba(255,80,80,.4);
  border-radius:12px;
  padding:12px;
  margin:10px 0;
  transition:.3s;
}

.match:hover{
  transform:scale(1.02);
  box-shadow:0 0 12px rgba(255,0,0,.4);
}

.text{
  font-size:15px;
  margin-bottom:8px;
  color:#ffd6d6;
}

.btn{
  display:inline-block;
  padding:6px 10px;
  background:#ff3333;
  color:#fff;
  border-radius:8px;
  text-decoration:none;
  font-size:13px;
  transition:.2s;
}

.btn:hover{
  background:#ff5555;
}
</style>

<script>
async function getClubName(url){
  const res = await fetch(url);
  const data = await res.json();
  return data.name || "Unknown Club";
}

fetch("https://api.chess.com/pub/club/blunder-master-vn/matches")
.then(r => r.json())
.then(async data => {

  const upcoming = data.registered || [];
  upcoming.sort((a,b)=>a.start_time-b.start_time);

  const latest = upcoming.slice(0,3);

  const html = await Promise.all(latest.map(async m => {

    const opponentUrl = m.opponent?.url;
    const opponentName = opponentUrl
      ? await getClubName(opponentUrl)
      : "Unknown Club";

    const date = m.start_time
      ? new Date(m.start_time*1000).toLocaleString("vi-VN")
      : "Unknown time";

    return `
      <div class="match">
        <div class="text">⚔️ "${opponentName}", "${date}"</div>
        <a class="btn" href="${m.url}" target="_blank">Tham gia match</a>
      </div>
    `;
  }));

  document.getElementById("matches").innerHTML = html.join("");

})
.catch(()=>{
  document.getElementById("matches").innerHTML =
    "<div class='match'>Không tải được dữ liệu</div>";
});
</script>
